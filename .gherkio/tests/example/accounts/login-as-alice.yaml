scenario: login as alice via $accounts variable

steps:
  - request:
      method: POST
      url: /auth/login

      body:
        username: $accounts.alice.username
        password: $accounts.alice.password
        expiresInMins: 30

    expect:
      status: 200
      body.accessToken: exists
      body.refreshToken: exists
      body.email: email
      schema: example/login-response

    save:
      accessToken: body.accessToken
      refreshToken: body.refreshToken

  - request:
      method: GET
      url: /auth/me
      headers:
        Authorization: Bearer $accessToken
    expect:
      status: 200
      body.username: $accounts.alice.username
      schema: example/user-response
