scenario: delete email address

steps:
  # Register user
  - request:
      method: POST
      url: /api/user/register

    expect:
      status: 200
      body.success: true

    save:
      token: body.user.token

  # Create address
  - request:
      method: POST
      url: /api/addresses
      headers:
        Authorization: Bearer $token

    expect:
      status: 200
      body.success: true

    save:
      addressId: body.address.id
      addressStr: body.address.address

  # Verify address exists in list
  - request:
      method: GET
      url: /api/addresses
      headers:
        Authorization: Bearer $token

    expect:
      status: 200

  # Delete the address
  - request:
      method: DELETE
      url: /api/addresses/$addressId
      headers:
        Authorization: Bearer $token

    expect:
      status: 200
      body.success: true
      body.message: Email address deleted

  # Verify address count decreased
  - request:
      method: GET
      url: /api/addresses
      headers:
        Authorization: Bearer $token

    expect:
      status: 200
      body.addresses: exists

  # Try to delete non-existent address (should 404)
  - request:
      method: DELETE
      url: /api/addresses/non-existent-id
      headers:
        Authorization: Bearer $token

    expect:
      status: 404
      body.error: exists

  # Try to delete without auth (should 401)
  - request:
      method: DELETE
      url: /api/addresses/some-id

    expect:
      status: 401
      body.error: exists
