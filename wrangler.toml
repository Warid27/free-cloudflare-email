name = "free-cloudflare-email"
main = "src/index.ts"
compatibility_date = "2024-10-31"
compatibility_flags = ["nodejs_compat"]

# Assets disabled - UI is served inline via TypeScript

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "email-system-db"
database_id = "7e3201f2-e651-4555-a129-185290f08853"

# Email routing bindings
[[send_email]]
name = "SEND_EMAIL"

# Cron trigger for email cleanup
[triggers]
crons = ["0 2 * * *"] # <-- Set your cron expression here

# Environment variables
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "http://localhost:4321,https://al-warid.web.id,https://*.pages.dev"
